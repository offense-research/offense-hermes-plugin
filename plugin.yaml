name: offense
version: 0.2.0
description: >-
  Offense security team for Hermes: spin up isolated security sandboxes,
  summon swarms against a verified staging target, read findings and evidence,
  verify candidates, and retest fixes.
author: Offense Research
license: Apache-2.0
homepage: https://github.com/offense-research/offense-hermes-plugin
requires_hermes: ">=0.19.0"
provides_tools:
  - offense_status
  - offense_register_target
  - offense_verify_target
  - offense_launch_sandbox
  - offense_list_sandboxes
  - offense_get_sandbox
  - offense_wait_sandbox
  - offense_sandbox_findings
  - offense_sandbox_evidence
  - offense_stop_sandbox
  - offense_verify_finding
  - offense_retest_finding
  - offense_list_swarms
  - offense_summon_swarm
  - offense_get_swarm
  - offense_wait_swarm
  - offense_stop_swarm
provides_hooks:
  - pre_llm_call
requires_env:
  - name: OFFENSE_API_KEY
    description: >-
      Offense API key. Create one in the Offense dashboard under Settings.
      Hermes stores it in the active profile; the plugin never writes it to
      its own file.
    url: https://app.offense.sh/app/settings
    secret: true
config_schema:
  base_url:
    type: str
    default: https://app.offense.sh
    label: Offense base URL
    description: API origin. Change only for a self-hosted Offense.
  inject_active_work:
    type: bool
    default: true
    label: Mention active work each turn
    description: >-
      Add a short note when sandboxes or swarms are already running, so the
      agent does not launch duplicates.
  active_work_ttl_seconds:
    type: int
    default: 45
    label: Active-work cache seconds
    description: How long the active-work note is cached before it is refreshed.
